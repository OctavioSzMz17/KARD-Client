<div class="app-shell">

  <!-- Fondo ambiental: el mismo del catálogo de clientes. -->
  <div class="ambient" aria-hidden="true">
    <i class="orb orb-1"></i>
    <i class="orb orb-2"></i>
    <i class="orb orb-3"></i>
    <i class="slash"></i>
    <div class="stars"></div>
  </div>

  <!-- Íconos del menú, definidos una sola vez. -->
  <ng-template #icon let-name>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @switch (name) {
        @case ('home') { <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/> }
        @case ('cart') { <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/> }
        @case ('cash') { <rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/> }
        @case ('box') { <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/> }
        @case ('archive') { <polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/> }
        @case ('chart') { <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/> }
        @case ('palette') {
          <circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/>
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
        }
        @case ('card') { <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/> }
        @case ('users') { <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/> }
        @case ('log') { <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/> }
      }
    </svg>
  </ng-template>

  <!-- ── Menú lateral ───────────────────────────────────── -->
  <!-- En celular el menú es un cajón que entra desde la izquierda; este velo lo cierra. -->
  @if (menuOpen()) {
    <div class="menu-scrim" (click)="closeMenu()" aria-hidden="true"></div>
  }
  <aside class="sidebar" id="panel-menu" [class.open]="menuOpen()">
    <div class="sidebar-logo">
      <svg width="32" height="32" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect width="40" height="40" rx="9" fill="white" fill-opacity="0.2"/>
        <path d="M10 10H18L24 20L18 30H10L16 20L10 10Z" fill="white"/>
        <path d="M20 10H28L22 20L28 30H20L14 20L20 10Z" fill="white" fill-opacity="0.6"/>
      </svg>
      <span class="logo-label">KARD</span>
      <button class="menu-close" type="button" (click)="closeMenu()" aria-label="Cerrar menú">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Menú del panel">
      @for (item of navItems; track item.route; let i = $index) {
        @if (item.enabled) {
          <a
            class="nav-item"
            [style.--i]="i"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
          >
            <span class="nav-icon"><ng-container *ngTemplateOutlet="icon; context: { $implicit: item.icon }" /></span>
            {{ item.label }}
          </a>
        } @else {
          <span class="nav-item disabled" [style.--i]="i" aria-disabled="true">
            <span class="nav-icon"><ng-container *ngTemplateOutlet="icon; context: { $implicit: item.icon }" /></span>
            {{ item.label }}
            <span class="coming-soon">Pronto</span>
          </span>
        }
      }
    </nav>

    <button class="logout-btn" (click)="logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Cerrar sesión
    </button>
  </aside>

  <!-- ── Área de trabajo ────────────────────────────────── -->
  <div class="workspace">
    <header class="topbar">
      <button class="menu-toggle" type="button" (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()" aria-controls="panel-menu" aria-label="Abrir menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>

      <div class="topbar-title">
        @if (page().title) {
          <h1><span class="grad">{{ page().title }}</span></h1>
          @if (page().subtitle) { <p>{{ page().subtitle }}</p> }
        }
      </div>

      <div class="topbar-actions">
        <span class="user-chip" [title]="'Sesión de ' + roleLabel()">
          <span class="dot-live"></span>
          <span class="chip-text">{{ businessLabel() }} · {{ roleLabel() }}</span>
        </span>
      </div>
    </header>

    <!-- Las vistas que aún no se rediseñan conservan su aspecto claro: `.light` las
         asienta sobre un lienzo propio. Un solo outlet, para no reconstruir la página al navegar. -->
    <main class="main-content" [class.light]="!page().dark">
      <router-outlet />
    </main>
  </div>
</div>
