@if (notice(); as n) {
  <div class="scrim" (click)="notices.close()" aria-hidden="true"></div>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="plan-notice-title" aria-describedby="plan-notice-message">
    <span class="badge" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </span>
    <h2 id="plan-notice-title">{{ n.title }}</h2>
    <p id="plan-notice-message">{{ n.message }}</p>
    <div class="actions">
      @if (n.secondary; as s) {
        <button type="button" class="ghost" (click)="notices.run(s.action)">{{ s.label }}</button>
      }
      <button #primary type="button" class="primary" (click)="notices.run(n.primary.action)">{{ n.primary.label }}</button>
    </div>
  </section>
}
